[package]
name = "novafractal"
version = "0.1.0"
edition = "2024"
default-run = "novafractal"

[features]
simd=[]
cuda = ["dep:cudarc"]

[dependencies]
libc    = "0.2"
pollster = "0.3"
eframe  = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui    = { version = "0.33", default-features = false, features = ["default_fonts"] }
rayon   = "1.10"
image   = { version = "0.25", default-features = false, features = ["png"] }
num-complex = "0.4"
wgpu = "22"
bytemuck = { version = "1", features = ["derive"] }
cudarc  = { version = "0.12", features = ["cuda-12000"], optional = true }
wide = "0.7"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rayon = "1.10"

[[bench]]
name = "fractal_bench"
harness = false

[[bin]]
name = "bench_runner"
path = "src/bin/bench_runner.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = true           # keep symbols for perf annotate / flamegraphs